<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outages Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/lucide-static@0.468.0/icons/activity.svg">
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #222;
            margin-top: 0;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .file-box {
            border: 2px dashed #ccd1d9;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            background: #fafbfc;
            cursor: pointer;
            transition: border-color 0.3s;
            margin-bottom: 20px;
        }
        .file-box:hover {
            border-color: #0088cc;
        }
        input[type="file"] {
            display: none;
        }
        .file-label {
            font-weight: 600;
            color: #444;
            display: block;
            margin-bottom: 5px;
            cursor: pointer;
        }
        .file-info {
            font-size: 12px;
            color: #888;
        }
        button {
            background-color: #CCFFFF;
            color: #004050;
            border: 1px solid #99e6e6;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #b3ffff;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #e6e9ed;
            color: #aab2bd;
            border: none;
            cursor: not-allowed;
            transform: none;
        }
        #log-area {
            margin-top: 20px;
            background: #1e1e1e;
            color: #a6e22e;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            white-space: pre-wrap;
        }
        :root {
            --ink: #173238;
            --muted: #64777a;
            --line: #d8e4e4;
            --teal: #087e83;
            --teal-dark: #07565d;
            --aqua: #c8eeee;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            padding: 48px 22px;
            display: grid;
            place-items: center;
            background-color: #eaf0ee;
            background-image: radial-gradient(rgba(8, 126, 131, 0.11) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--ink);
            font-family: 'DM Sans', sans-serif;
        }
        .container {
            position: relative;
            overflow: hidden;
            max-width: 680px;
            padding: 40px;
            border: 1px solid var(--line);
            border-radius: 9px;
            box-shadow: 0 18px 48px rgba(13, 57, 59, 0.12);
        }
        .container::before {
            content: "";
            position: absolute;
            inset: 0 0 auto;
            height: 5px;
            background: linear-gradient(90deg, var(--teal) 0 72%, #f0ad3d 72% 100%);
        }
        .masthead {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .brand-mark {
            display: grid;
            place-items: center;
            flex: 0 0 50px;
            width: 50px;
            height: 50px;
            border-radius: 7px;
            background: var(--teal-dark);
            color: #e5ffff;
            font-size: 26px;
        }
        .eyebrow {
            margin-bottom: 3px;
            color: var(--teal);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        h1 {
            margin: 0;
            color: var(--ink);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 29px;
            line-height: 1.15;
        }
        p {
            margin: 0 0 25px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }
        p strong, p code {
            color: var(--teal-dark);
        }
        .file-box {
            position: relative;
            display: flex;
            align-items: center;
            gap: 15px;
            min-height: 108px;
            padding: 20px;
            border: 1px dashed #8db9b8;
            border-radius: 7px;
            background: linear-gradient(120deg, #f3fbfa, #edf7f5);
            text-align: left;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        .file-box:hover, .file-box:focus-within {
            border-color: var(--teal);
            background: #f0faf8;
        }
        .file-box:focus-within {
            outline: 3px solid rgba(8, 126, 131, 0.2);
            outline-offset: 3px;
        }
        .upload-mark {
            display: grid;
            place-items: center;
            flex: 0 0 46px;
            width: 46px;
            height: 46px;
            border: 1px solid #d3e6e3;
            border-radius: 7px;
            background: #fff;
            color: var(--teal);
            font-size: 23px;
            font-weight: 700;
        }
        .file-copy { min-width: 0; }
        input[type="file"] {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .file-label {
            margin-bottom: 4px;
            color: var(--ink);
            overflow-wrap: anywhere;
        }
        .file-info { color: var(--muted); font-size: 12px; }
        .file-type {
            flex: 0 0 auto;
            border: 1px solid #d8e6e2;
            border-radius: 4px;
            padding: 6px 8px;
            background: #fff;
            color: #456b69;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        button {
            min-height: 54px;
            border: 0;
            border-radius: 6px;
            background: var(--teal-dark);
            color: #fff;
            font: 700 14px 'DM Sans', sans-serif;
            transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }
        button:hover {
            background: #06464b;
            box-shadow: 0 4px 12px rgba(7, 86, 93, 0.2);
        }
        button:focus-visible {
            outline: 3px solid #e8a82e;
            outline-offset: 3px;
        }
        button:disabled { background: #e4eae8; color: #899794; }
        #log-area {
            border: 1px solid #254d4d;
            border-left: 4px solid #35b3a5;
            border-radius: 5px;
            padding: 15px;
            background: #142a2a;
            color: #cde8df;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 12px;
            line-height: 1.6;
        }
        .lucide {
            display: block;
            width: 20px;
            height: 20px;
            stroke-width: 1.9;
        }
        .brand-mark .lucide { width: 25px; height: 25px; }
        .upload-mark .lucide { width: 22px; height: 22px; }
        button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }
        @media (max-width: 760px) {
            body { padding: 24px 16px; }
        }
        @media (max-width: 560px) {
            body { padding: 20px 14px; }
            .container { padding: 31px 22px 24px; }
            .masthead { gap: 12px; }
            .brand-mark { flex-basis: 44px; width: 44px; height: 44px; font-size: 23px; }
            h1 { font-size: 25px; }
            .file-box { gap: 12px; padding: 15px; }
            .file-type { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>

<main class="container">
    <div class="masthead">
        <div class="brand-mark" aria-hidden="true"><i data-lucide="activity"></i></div>
        <div>
            <div class="eyebrow">Network operations</div>
            <h1>Outages Dashboard</h1>
        </div>
    </div>
    <p>Upload your raw outages export (supports raw <strong>.xlsx</strong> or <strong>.zip</strong> archives). Target sheet (<strong>outages</strong>) will be parsed and cross-referenced with <code>ref1.xlsx</code>.</p>
    
    <label class="file-box" for="outageFile">
        <span class="upload-mark" aria-hidden="true"><i data-lucide="upload"></i></span>
        <span class="file-copy">
            <span class="file-label" id="file-label-text">Select an Outages export</span>
            <span class="file-info">Choose an .xlsx file or a .zip archive</span>
        </span>
        <span class="file-type" aria-hidden="true">XLSX / ZIP</span>
        <input type="file" id="outageFile" accept=".xlsx,.zip" aria-label="Select an Outages export">
    </label>

    <button id="processBtn" disabled><i data-lucide="file-spreadsheet" aria-hidden="true"></i> Process & Generate Outages Summary</button>
    
    <div id="log-area" role="log" aria-live="polite"></div>
</main>

<script>
    const outageInput = document.getElementById('outageFile');
    const processBtn = document.getElementById('processBtn');
    const logArea = document.getElementById('log-area');
    if (window.lucide) lucide.createIcons();

    function log(message, type = 'info') {
        logArea.style.display = 'block';
        let prefix = "INFO | ";
        if (type === 'success') prefix = "SUCCESS | ";
        if (type === 'error') prefix = "ERROR | ";
        logArea.innerText += prefix + message + "\n";
        logArea.scrollTop = logArea.scrollHeight;
    }

    function getCleanCellValue(cell) {
        if (!cell || cell.value === null || cell.value === undefined) return "";
        if (cell.value instanceof Date) return cell.value;
        
        if (typeof cell.value === 'object') {
            if (cell.value.result instanceof Date) return cell.value.result;
            if (cell.value.result !== undefined) return String(cell.value.result).trim();
            if (cell.value.richText !== undefined) {
                return cell.value.richText.map(t => t.text || "").join("").trim();
            }
            if (cell.value.text !== undefined) return String(cell.value.text).trim();
            return "";
        }
        return String(cell.value).trim();
    }

    function getFormattedTimestamp() {
        const now = new Date();
        const pad = (num) => String(num).padStart(2, '0');
        return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
    }

    // Helper to sanitize Excel sheet names (max 31 chars, remove forbidden characters)
    function sanitizeSheetName(name) {
        const cleanName = name.replace(/[\\/?*\[\]]/g, '').trim();
        return cleanName.substring(0, 31) || "Sheet";
    }

    outageInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            document.getElementById('file-label-text').innerText = e.target.files[0].name;
            processBtn.disabled = false;
            logArea.innerText = "";
            logArea.style.display = 'none';
        }
    });

    processBtn.addEventListener('click', async () => {
        processBtn.disabled = true;
        logArea.innerText = "";
        
        try {
            log("Fetching fresh reference database (ref1.xlsx)...");
            
            const refResponse = await fetch(`ref1.xlsx?t=${Date.now()}`, {
                cache: 'no-store',
                headers: {
                    'Cache-Control': 'no-cache, no-store, must-revalidate',
                    'Pragma': 'no-cache',
                    'Expires': '0'
                }
            });

            if (!refResponse.ok) {
                throw new Error("Could not find 'ref1.xlsx' in the directory. Please verify file placement.");
            }
            
            const refBuffer = await refResponse.arrayBuffer();
            const refWorkbook = new ExcelJS.Workbook();
            await refWorkbook.xlsx.load(refBuffer);
            const refSheet = refWorkbook.worksheets[0];

            log("Indexing Power Owner lookup map from ref1...");
            const powerOwnerMap = {};
            let refHeaders = [];

            refSheet.getRow(1).eachCell((cell, colNum) => {
                refHeaders[colNum] = getCleanCellValue(cell).toLowerCase().replace(/\s+/g, ' ').trim();
            });

            const idxSiteId = refHeaders.indexOf('site id');
            const idxPowerOwner = refHeaders.indexOf('new power owner');

            if (idxSiteId === -1 || idxPowerOwner === -1) {
                throw new Error("Reference file invalid! Ensure 'Site ID' and 'New Power Owner' columns exist in ref1.xlsx.");
            }

            refSheet.eachRow((row, rowNum) => {
                if (rowNum === 1) return;
                const rawIdText = getCleanCellValue(row.getCell(idxSiteId));
                if (!rawIdText) return;
                const siteId = parseInt(rawIdText, 10);
                if (isNaN(siteId)) return;

                const powerOwnerVal = getCleanCellValue(row.getCell(idxPowerOwner));
                powerOwnerMap[siteId] = powerOwnerVal || 0;
            });

            log("Reference engine ready.", "success");

            const rawFile = outageInput.files[0];
            let fileBuffer;

            if (rawFile.name.toLowerCase().endsWith('.zip')) {
                log("Extracting uploaded ZIP archive...");
                const zip = await JSZip.loadAsync(rawFile);
                const targetZipFile = Object.values(zip.files).find(f => !f.dir && f.name.toLowerCase().endsWith('.xlsx'));
                if (!targetZipFile) {
                    throw new Error("Invalid Archive! No .xlsx file found inside ZIP container.");
                }
                fileBuffer = await targetZipFile.async("arraybuffer");
            } else {
                log("Reading main outage workbook...");
                fileBuffer = await rawFile.arrayBuffer();
            }

            const inputWorkbook = new ExcelJS.Workbook();
            await inputWorkbook.xlsx.load(fileBuffer);

            const targetSheetNames = ["outages"];
            const availableSheets = inputWorkbook.worksheets;

            const targetOutputColumns = [
                'Incident ID', 'Site ID', 'Site Name', 'Power Owner', 'Region', 
                'Cluster', 'Fault Cause', 'PowerCo', 'Start Time', 'DownTime', 
                'Solution Owner', 'Affected Services', 'Outage ID'
            ];

            const outputWorkbook = new ExcelJS.Workbook();

            for (const targetName of targetSheetNames) {
                const sheet = availableSheets.find(s => s.name.trim().toLowerCase() === targetName.toLowerCase());
                
                if (!sheet) {
                    log(`Warning: Sheet '${targetName}' not found in payload. Skipping...`, 'error');
                    continue;
                }

                log(`Parsing target sheet: '${sheet.name}'...`);
                
                let sheetHeaders = [];
                sheet.getRow(1).eachCell((cell, colNum) => {
                    sheetHeaders[colNum] = getCleanCellValue(cell).trim();
                });

                const colMap = {};
                targetOutputColumns.forEach(col => {
                    if (col !== 'Power Owner') {
                        colMap[col] = sheetHeaders.indexOf(col);
                    }
                });

                // Standardized styling rules
                const thinBorder = { style: 'thin', color: { argb: 'FF000000' } };
                const fullBorder = { left: thinBorder, right: thinBorder, top: thinBorder, bottom: thinBorder };

                // Utility function to initialize a standard formatted worksheet
                const createFormattedSheet = (sheetName) => {
                    const ws = outputWorkbook.addWorksheet(sanitizeSheetName(sheetName), {
                        views: [{ showGridLines: true, zoomScale: 80 }]
                    });

                    const headerRow = ws.getRow(1);
                    headerRow.values = targetOutputColumns;
                    headerRow.height = 30;
                    headerRow.eachCell((cell) => {
                        cell.font = { name: 'Calibri', size: 11, bold: true, color: { argb: 'FF000000' } };
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFCCFFFF' } };
                        cell.alignment = { horizontal: 'center', vertical: 'middle' };
                        cell.border = fullBorder;
                    });

                    return ws;
                };

                // Utility function to add data rows to a worksheet
                const populateRows = (ws, rowsData) => {
                    rowsData.forEach(rowData => {
                        const addedRow = ws.addRow(rowData);
                        addedRow.height = 18;
                        addedRow.eachCell((cell) => {
                            cell.font = { name: 'Calibri', size: 11 };
                            cell.border = fullBorder;
                            cell.alignment = { horizontal: 'left', vertical: 'middle' };
                        });
                    });

                    targetOutputColumns.forEach((colName, colIdx) => {
                        let maxLen = 12;
                        ws.getColumn(colIdx + 1).eachCell((cell) => {
                            const val = String(cell.value || "");
                            if (val.length > maxLen) maxLen = val.length;
                        });

                        if (colName === 'Incident ID' || colName === 'Outage ID') {
                            ws.getColumn(colIdx + 1).width = 14;
                        } else {
                            ws.getColumn(colIdx + 1).width = maxLen + 4;
                        }
                    });

                    ws.autoFilter = `A1:${String.fromCharCode(64 + targetOutputColumns.length)}${ws.rowCount}`;
                };

                // Parse records and map by Outage ID
                const allProcessedRows = [];
                const outageGroups = {};
                const outageIdIdx = targetOutputColumns.indexOf('Outage ID');

                sheet.eachRow((row, rowNum) => {
                    if (rowNum === 1) return;

                    const rowData = [];
                    const siteIdColIdx = colMap['Site ID'];
                    let currentSiteId = null;

                    if (siteIdColIdx !== -1 && siteIdColIdx !== undefined) {
                        const rawId = getCleanCellValue(row.getCell(siteIdColIdx));
                        currentSiteId = parseInt(rawId, 10);
                    }

                    targetOutputColumns.forEach(col => {
                        if (col === 'Power Owner') {
                            if (!isNaN(currentSiteId) && powerOwnerMap[currentSiteId] !== undefined) {
                                rowData.push(powerOwnerMap[currentSiteId]);
                            } else {
                                rowData.push(0);
                            }
                        } else {
                            const originalIdx = colMap[col];
                            if (originalIdx !== undefined && originalIdx !== -1) {
                                rowData.push(getCleanCellValue(row.getCell(originalIdx)));
                            } else {
                                rowData.push("");
                            }
                        }
                    });

                    allProcessedRows.push(rowData);

                    const outageId = rowData[outageIdIdx];
                    if (outageId) {
                        if (!outageGroups[outageId]) outageGroups[outageId] = [];
                        outageGroups[outageId].push(rowData);
                    }
                });

                // 1. Create main 'outages' sheet containing all records
                const mainSheet = createFormattedSheet(sheet.name);
                populateRows(mainSheet, allProcessedRows);

                // 2. Separate into grouped sheets (Outage ID >= 2) and remaining single records
                log("Grouping outages by Outage ID...");
                const singleRows = [];
                const groupedOutageIds = new Set();

                Object.entries(outageGroups).forEach(([outageId, rows]) => {
                    if (rows.length >= 2) {
                        groupedOutageIds.add(outageId);
                        const groupSheet = createFormattedSheet(`Outage_${outageId}`);
                        populateRows(groupSheet, rows);
                    }
                });

                // 3. Collect single or unassigned outage records
                allProcessedRows.forEach(row => {
                    const outageId = row[outageIdIdx];
                    if (!outageId || !groupedOutageIds.has(outageId)) {
                        singleRows.push(row);
                    }
                });

                // 4. Create single outages sheet if any standalone records exist
                if (singleRows.length > 0) {
                    const singleSheet = createFormattedSheet("Single Outages");
                    populateRows(singleSheet, singleRows);
                }
            }

            const timestamp = getFormattedTimestamp();
            const outputFilename = `Sites_Down_${timestamp}.xlsx`;

            log(`Generating report file: ${outputFilename}...`);
            const buffer = await outputWorkbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = outputFilename;
            link.click();

            log("Processing completed successfully!", "success");

        } catch (err) {
            log(err.message, "error");
            console.error(err);
        } finally {
            processBtn.disabled = false;
        }
    });
</script>

</body>
</html>
