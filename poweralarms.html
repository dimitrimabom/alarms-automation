<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Alarms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/lucide-static@0.468.0/icons/zap.svg">
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <style>
        :root {
            color-scheme: light;
            --ink: #17231f;
            --muted: #64716c;
            --line: #dce4df;
            --paper: #ffffff;
            --canvas: #edf1ed;
            --amber: #f2bf24;
            --green: #21463a;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--canvas);
            background-image: linear-gradient(rgba(255,255,255,0.42) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.42) 1px, transparent 1px);
            background-size: 32px 32px;
            color: var(--ink);
            margin: 0;
            min-height: 100vh;
            padding: 48px 24px;
            display: grid;
            place-items: center;
        }
        .container {
            position: relative;
            overflow: hidden;
            background: var(--paper);
            padding: 42px;
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: 0 18px 50px rgba(24, 45, 37, 0.09);
            max-width: 680px;
            width: 100%;
        }
        .container::before {
            content: "";
            position: absolute;
            inset: 0 0 auto;
            height: 5px;
            background: linear-gradient(90deg, var(--amber) 0 28%, var(--green) 28% 100%);
        }
        .masthead {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        .brand-mark {
            display: grid;
            place-items: center;
            flex: 0 0 52px;
            width: 52px;
            height: 52px;
            border-radius: 8px;
            background: var(--amber);
            color: #241e0b;
            font-size: 28px;
            line-height: 1;
        }
        .eyebrow {
            margin: 0 0 4px;
            color: var(--green);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }
        h1 {
            color: var(--ink);
            margin: 0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 30px;
            line-height: 1.1;
        }
        p {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.65;
            margin: 0 0 28px;
            max-width: 560px;
        }
        p strong {
            color: var(--ink);
        }
        .file-box {
            position: relative;
            display: flex;
            align-items: center;
            gap: 16px;
            min-height: 112px;
            border: 1px dashed #a9b9b0;
            padding: 22px;
            border-radius: 8px;
            text-align: left;
            background: linear-gradient(120deg, #f7faf7, #f1f5f1);
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
            margin-bottom: 16px;
        }
        .file-box:hover,
        .file-box:focus-within {
            border-color: var(--green);
            background: #f5f9f4;
        }
        .file-box:focus-within {
            outline: 3px solid rgba(242, 191, 36, 0.42);
            outline-offset: 3px;
        }
        .upload-mark {
            display: grid;
            place-items: center;
            flex: 0 0 48px;
            width: 48px;
            height: 48px;
            border: 1px solid #d9e3dc;
            border-radius: 8px;
            background: #fff;
            color: var(--green);
            font-size: 24px;
            font-weight: 600;
        }
        .file-copy {
            min-width: 0;
        }
        input[type="file"] {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .file-label {
            font-weight: 600;
            color: var(--ink);
            display: block;
            margin-bottom: 4px;
            cursor: pointer;
            overflow-wrap: anywhere;
        }
        .file-info {
            color: var(--muted);
            font-size: 13px;
        }
        .file-type {
            flex: 0 0 auto;
            border: 1px solid #dbe3dd;
            border-radius: 4px;
            padding: 6px 8px;
            background: #fff;
            color: #52635a;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.4px;
        }
        button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 56px;
            background: var(--amber);
            color: #211b09;
            border: none;
            padding: 14px 20px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }
        button:hover {
            background: #e8b20e;
            box-shadow: 0 5px 14px rgba(161, 119, 0, 0.18);
        }
        button:active {
            transform: translateY(1px);
        }
        button:focus-visible {
            outline: 3px solid var(--green);
            outline-offset: 3px;
        }
        button:disabled {
            background: #e7ebe8;
            color: #8a9690;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .button-arrow {
            font-size: 20px;
            line-height: 1;
        }
        .lucide {
            display: block;
            width: 20px;
            height: 20px;
            stroke-width: 1.8;
        }
        .brand-mark .lucide { width: 25px; height: 25px; }
        .upload-mark .lucide { width: 22px; height: 22px; }
        #log-area {
            margin-top: 18px;
            border: 1px solid #263d34;
            border-left: 4px solid var(--amber);
            background: #17251f;
            color: #d4e5da;
            padding: 16px;
            border-radius: 5px;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 12px;
            line-height: 1.6;
            max-height: 220px;
            overflow-y: auto;
            display: none;
            white-space: pre-wrap;
        }
        @media (max-width: 760px) {
            body { padding: 24px 16px; }
        }
        @media (max-width: 560px) {
            body {
                padding: 20px 14px;
            }
            .container {
                padding: 30px 22px 24px;
            }
            .masthead {
                align-items: flex-start;
                gap: 12px;
            }
            .brand-mark {
                flex-basis: 44px;
                width: 44px;
                height: 44px;
                font-size: 24px;
            }
            h1 {
                font-size: 25px;
            }
            .file-box {
                gap: 12px;
                padding: 16px;
            }
            .file-type {
                display: none;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<main class="container">
    <div class="masthead">
        <div class="brand-mark" aria-hidden="true"><i data-lucide="zap"></i></div>
        <div>
            <div class="eyebrow">Network operations</div>
            <h1>Power Alarms</h1>
        </div>
    </div>
    <p>Upload your raw alarm file (supports raw <strong>.xlsx</strong> or compressed <strong>.zip</strong>). The dashboard will automatically handle decompression and reference correlation maps.</p>
    
    <label class="file-box" for="alarmFile">
        <span class="upload-mark" aria-hidden="true"><i data-lucide="upload"></i></span>
        <span class="file-copy">
            <span class="file-label" id="file-label-text">Select a Power Alarm export</span>
            <span class="file-info">Choose an .xlsx file or a .zip archive</span>
        </span>
        <span class="file-type" aria-hidden="true">XLSX / ZIP</span>
        <input type="file" id="alarmFile" accept=".xlsx,.zip" aria-label="Select a Power Alarm export">
    </label>

    <button id="processBtn" disabled><i data-lucide="file-spreadsheet" aria-hidden="true"></i> Generate Formatted Alarm Report</button>
    
    <div id="log-area" role="log" aria-live="polite"></div>
</main>

<script>
    const alarmInput = document.getElementById('alarmFile');
    const processBtn = document.getElementById('processBtn');
    const logArea = document.getElementById('log-area');
    if (window.lucide) lucide.createIcons();

    function log(message, type = 'info') {
        logArea.style.display = 'block';
        let prefix = "INFO | ";
        if (type === 'success') prefix = "SUCCESS | ";
        if (type === 'error') prefix = "ERROR | ";
        logArea.innerText += prefix + message + "\n";
        logArea.scrollTop = logArea.scrollHeight;
    }

    function getCleanCellValue(cell) {
        if (!cell || cell.value === null || cell.value === undefined) return "";
        if (cell.value instanceof Date) return cell.value;
        
        if (typeof cell.value === 'object') {
            if (cell.value.result instanceof Date) return cell.value.result;
            if (cell.value.result !== undefined) return String(cell.value.result).trim();
            if (cell.value.richText !== undefined) {
                return cell.value.richText.map(t => t.text || "").join("").trim();
            }
            if (cell.value.text !== undefined) return String(cell.value.text).trim();
            return "";
        }
        return String(cell.value).trim();
    }

    alarmInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            document.getElementById('file-label-text').innerText = e.target.files[0].name;
            processBtn.disabled = false;
            logArea.innerText = "";
            logArea.style.display = 'none';
        }
    });

    processBtn.addEventListener('click', async () => {
        processBtn.disabled = true;
        logArea.innerText = "";
        
        try {
            log("Connecting to reference master database file (ref1.xlsx)...");
            
            // Cache-busting URL parameter + explicit No-Cache headers
            const refResponse = await fetch(`ref1.xlsx?t=${Date.now()}`, {
                cache: 'no-store',
                headers: {
                    'Cache-Control': 'no-cache, no-store, must-revalidate',
                    'Pragma': 'no-cache',
                    'Expires': '0'
                }
            });

            if (!refResponse.ok) {
                throw new Error("Could not find 'ref1.xlsx' in the hosting folder directory layout. Verify its placement.");
            }
            const refBuffer = await refResponse.arrayBuffer();
            const refWorkbook = new ExcelJS.Workbook();
            await refWorkbook.xlsx.load(refBuffer);
            const refSheet = refWorkbook.worksheets[0];

            log("Syncing database reference dictionaries configurations...");
            const powerCoMap = {};
            const childrenMap = {};
            const backboneMap = {};
            const regionMap = {}; 
            const ruralSitesMap = {}; 

            let refHeaders = [];
            refSheet.getRow(1).eachCell((cell, colNum) => {
                refHeaders[colNum] = getCleanCellValue(cell).toLowerCase().replace(/\s+/g, ' ').trim();
            });

            const idxSiteId = refHeaders.indexOf('site id');
            const idxPowerCo = refHeaders.indexOf('new power owner');
            const idxChildren = refHeaders.indexOf('children');
            const idxBackbone = refHeaders.indexOf('backbone site');
            const idxRegion = refHeaders.indexOf('region'); 
            const idxRuralSites = refHeaders.indexOf('rural sites'); 

            if (idxSiteId === -1 || idxPowerCo === -1 || idxChildren === -1 || idxBackbone === -1 || idxRegion === -1) {
                throw new Error("Reference schema structure error! Core column headers missing or misspelled.");
            }

            refSheet.eachRow((row, rowNum) => {
                if (rowNum === 1) return;
                
                const rawIdText = getCleanCellValue(row.getCell(idxSiteId));
                if (!rawIdText) return;
                const siteId = parseInt(rawIdText, 10);
                if (isNaN(siteId)) return;

                const powerCoVal = getCleanCellValue(row.getCell(idxPowerCo));
                const childrenVal = getCleanCellValue(row.getCell(idxChildren));
                const backboneVal = getCleanCellValue(row.getCell(idxBackbone)).toLowerCase();
                const regionVal = getCleanCellValue(row.getCell(idxRegion));
                
                let ruralSitesVal = "";
                if (idxRuralSites !== -1) {
                    ruralSitesVal = getCleanCellValue(row.getCell(idxRuralSites));
                }

                powerCoMap[siteId] = powerCoVal || "IHS";
                childrenMap[siteId] = childrenVal ? parseFloat(childrenVal) : 0;
                backboneMap[siteId] = backboneVal; 
                regionMap[siteId] = regionVal || ""; 
                ruralSitesMap[siteId] = ruralSitesVal || ""; 
            });

            log("Reference engine initialized safely.", "success");

            // Step 2: Read Uploaded Alarm File & Auto-Detect ZIP Format
            const rawFile = alarmInput.files[0];
            let alarmBuffer;

            if (rawFile.name.toLowerCase().endsWith('.zip')) {
                log("Zip container detected! Initiating micro-decompression extraction layers...");
                const zip = await JSZip.loadAsync(rawFile);
                const targetZipFile = Object.values(zip.files).find(f => !f.dir && f.name.toLowerCase().endsWith('.xlsx'));
                if (!targetZipFile) {
                    throw new Error("Invalid Archive structure! No valid .xlsx spreadsheets found inside the uploaded .zip container.");
                }
                alarmBuffer = await targetZipFile.async("arraybuffer");
            } else {
                log("Reading uploaded data payload spreadsheet...");
                alarmBuffer = await rawFile.arrayBuffer();
            }

            const alarmWorkbook = new ExcelJS.Workbook();
            await alarmWorkbook.xlsx.load(alarmBuffer);
            const alarmSheet = alarmWorkbook.worksheets[0];

            let alarmHeaders = [];
            alarmSheet.getRow(1).eachCell((cell, colNum) => {
                alarmHeaders[colNum] = getCleanCellValue(cell).toLowerCase().replace(/\s+/g, ' ').trim();
            });

            const columnIndices = {
                'Site ID': alarmHeaders.indexOf('site id'),
                'Site Name': alarmHeaders.indexOf('site name'),
                'Ticket ID': alarmHeaders.indexOf('ticket id'),
                'Alarm Name': alarmHeaders.indexOf('alarm name'),
                'First Occurred On': alarmHeaders.indexOf('first occurred on'),
                'Duration(hh:mm:ss)': alarmHeaders.indexOf('duration(hh:mm:ss)'),
                'Last Occurred On': alarmHeaders.indexOf('last occurred on')
            };

            const missingCols = Object.keys(columnIndices).filter(col => columnIndices[col] === -1);
            if (missingCols.length > 0) {
                throw new Error(`Data structure error! Upload missing columns: ${missingCols.join(', ')}`);
            }

            log("Transforming records and evaluating updated dependency rule matrix conditions...");
            const finalData = [];
            let maxDate = new Date(0);

            alarmSheet.eachRow((row, rowNum) => {
                if (rowNum === 1) return;
                
                const rawIdText = getCleanCellValue(row.getCell(columnIndices['Site ID']));
                if (!rawIdText) return;
                const siteId = parseInt(rawIdText, 10);
                if (isNaN(siteId)) return;

                const siteName = getCleanCellValue(row.getCell(columnIndices['Site Name']));
                const ticketId = getCleanCellValue(row.getCell(columnIndices['Ticket ID']));
                const alarmName = getCleanCellValue(row.getCell(columnIndices['Alarm Name']));
                const firstOccurred = getCleanCellValue(row.getCell(columnIndices['First Occurred On']));
                const duration = getCleanCellValue(row.getCell(columnIndices['Duration(hh:mm:ss)']));
                const lastOccurred = getCleanCellValue(row.getCell(columnIndices['Last Occurred On']));

                if (lastOccurred) {
                    const parsedDate = new Date(lastOccurred);
                    if (!isNaN(parsedDate) && parsedDate > maxDate) {
                        maxDate = parsedDate;
                    }
                }

                const powerOwner = powerCoMap[siteId] || "IHS";
                const isBackbone = backboneMap[siteId] === 'yes';
                const kidsCount = childrenMap[siteId] || 0;
                const region = regionMap[siteId] || ""; 
                const ruralSites = ruralSitesMap[siteId] !== undefined ? ruralSitesMap[siteId] : "";

                let prediction = "";
                if (isBackbone) {
                    prediction = `${parseInt(kidsCount)} + BACKBONE`;
                } else {
                    prediction = parseInt(kidsCount);
                }

                finalData.push({
                    siteId, siteName, region, powerOwner, prediction, ruralSites, 
                    state: "",             // Empty for manual entry
                    transmissionState: "", // Empty for manual entry
                    isBackboneSite: isBackbone, ticketId, alarmName, firstOccurred, duration, lastOccurred
                });
            });

            // Step 3: Write Output Workbook Layout Matrix
            log("Configuring presentation styles layers and applying palette styling rules...");
            const outWorkbook = new ExcelJS.Workbook();
            const outSheet = outWorkbook.addWorksheet('Power Alarms Status', {
                views: [{ showGridLines: true }]
            });

            // Title span M1 (13 columns)
            outSheet.mergeCells('A1:M1'); 
            const titleCell = outSheet.getCell('A1');
            titleCell.value = "Power Alarms on TIS";
            titleCell.font = { name: 'Calibri', size: 14, bold: true, color: { argb: 'FF000000' } };
            titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
            titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFC000' } };
            outSheet.getRow(1).height = 30;

            const headers = [
                'Site ID', 'Site Name', 'Regions', 'Power Owner', 'Dependencies', 
                'Connected Rural Sites', 'State', 'Transmission State', 
                'Ticket ID', 'Alarm Name', 'First Occurred On', 'Duration (hh:mm:ss)', 'Last Occurred On'
            ];
            outSheet.getRow(2).values = headers;
            outSheet.getRow(2).height = 38; 

            outSheet.getRow(2).eachCell((cell) => {
                cell.font = { name: 'Calibri', size: 11, bold: true, color: { argb: 'FF000000' } };
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFC000' } };
                cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
            });

            finalData.forEach(item => {
                outSheet.addRow([
                    item.siteId, 
                    item.siteName, 
                    item.region, 
                    item.powerOwner, 
                    item.prediction,
                    item.ruralSites,
                    item.state,             // Col 7: State (Manual)
                    item.transmissionState, // Col 8: Transmission State (Manual)
                    item.ticketId, 
                    item.alarmName, 
                    item.firstOccurred, 
                    item.duration, 
                    item.lastOccurred
                ]);
            });

            const thinBorder = { style: 'thin', color: { argb: 'FF000000' } };
            const fullBorder = { left: thinBorder, right: thinBorder, top: thinBorder, bottom: thinBorder };

            outSheet.eachRow((row, rowNum) => {
                if (rowNum === 1) return;
                if (rowNum > 2) row.height = 18;
                
                const recordItem = finalData[rowNum - 3];
                
                for (let col = 1; col <= 13; col++) { 
                    const cell = row.getCell(col);
                    cell.border = fullBorder;

                    if (rowNum > 2) {
                        const shouldBold = (col === 5 && recordItem && recordItem.isBackboneSite);
                        
                        cell.font = { 
                            name: 'Calibri', 
                            size: 11, 
                            bold: shouldBold ? true : false,
                            color: { argb: 'FF000000' } 
                        };
                        
                        // Centered: Site ID, Rural Sites, State, Transmission State, Ticket ID, Dates, Duration
                        if ([1, 6, 7, 8, 9, 11, 12, 13].includes(col)) {
                            cell.alignment = { horizontal: 'center', vertical: 'middle' };
                        } else {
                            cell.alignment = { horizontal: 'left', vertical: 'middle' };
                        }
                    }
                }
            });

            // Column width calculations & fixed sizes for manual inputs
            for (let colIdx = 1; colIdx <= 13; colIdx++) {
                if (colIdx === 5 || colIdx === 6) {
                    outSheet.getColumn(colIdx).width = 24; 
                    continue; 
                }
                
                // Generous default width for manual filling
                if (colIdx === 7 || colIdx === 8) {
                    outSheet.getColumn(colIdx).width = 20;
                    continue;
                }

                let maxLen = 14;
                outSheet.getColumn(colIdx).eachCell((cell, rowNum) => {
                    if (rowNum > 2) {
                        const cellValStr = getCleanCellValue(cell);
                        if (cellValStr.length > maxLen) maxLen = cellValStr.length;
                    }
                });
                outSheet.getColumn(colIdx).width = maxLen + 4;
            }

            outSheet.autoFilter = `A2:M${outSheet.rowCount}`; 

            if (maxDate.getTime() === 0) maxDate = new Date();
            const minutes = maxDate.getMinutes();
            const remainder = minutes % 30;
            if (remainder >= 15) {
                maxDate.setMinutes(minutes + (30 - remainder), 0, 0);
            } else {
                maxDate.setMinutes(minutes - remainder, 0, 0);
            }
            
            const pad = (num) => String(num).padStart(2, '0');
            const timeString = `${pad(maxDate.getHours())}H${pad(maxDate.getMinutes())}`;
            const filename = `TIS_ALARMS${timeString}.xlsx`;

            log("Downloading processed report sheet...");
            const buffer = await outWorkbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();

            log("Report compiled successfully!", "success");

        } catch (error) {
            log(error.message, "error");
            console.error(error);
        } finally {
            processBtn.disabled = false;
        }
    });
</script>

</body>
</html>
